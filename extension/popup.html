<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OfficeMini</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff; --fg: #1c1c1e; --muted: #6b6b70; --line: #e2e2e6;
        --accent: #2b6cb0; --btn: #f4f4f6; --btn-hover: #e9e9ee;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #1e1e20; --fg: #e8e8ea; --muted: #9a9aa0; --line: #34343a; --accent: #6ea8e0; --btn: #2a2a2e; --btn-hover: #35353b; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; width: 288px; padding: 14px;
        font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg); color: var(--fg);
      }
      header { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
      header img { width: 28px; height: 28px; }
      header h1 { font-size: 14px; font-weight: 600; margin: 0; }
      header .v { font-size: 11px; color: var(--muted); }
      .row { display: flex; gap: 8px; margin-bottom: 12px; }
      button {
        flex: 1; padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px;
        background: var(--btn); color: inherit; font: inherit; cursor: pointer;
      }
      button:hover { background: var(--btn-hover); }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button.primary:hover { filter: brightness(1.07); }
      hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
      label { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
      label input { margin: 0; }
      .master { font-weight: 600; }
      .exts { color: var(--muted); font-size: 11px; margin-left: auto; }
      #groups { margin-left: 22px; }
      #groups.off { opacity: 0.45; pointer-events: none; }
      p.note { color: var(--muted); font-size: 11px; margin: 10px 0 0; }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/48.png" alt="" />
      <div>
        <h1>OfficeMini</h1>
        <div class="v" id="version"></div>
      </div>
    </header>

    <div class="row">
      <button class="primary" id="new-doc">New document</button>
      <button id="new-sheet">New spreadsheet</button>
    </div>
    <div class="row">
      <button id="open">Open a file…</button>
    </div>

    <hr />

    <label class="master"><input type="checkbox" id="enabled" /> Open downloads in the editor</label>
    <div id="groups"></div>
    <p class="note">Files stay on your machine. Nothing is uploaded, and the editor never sends the document anywhere.</p>
  </body>
  <script type="module" src="popup.js"></script>
</html>
